openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
  - name: staff
  - name: entities
  - name: notifications
  - name: sync
  - name: system
  - name: files
  - name: ai
  - name: property
  - name: platform-owner
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/classify-violation:
    post:
      operationId: classifyViolation
      tags: [ai]
      summary: Classify a photographed housing violation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViolationClassificationRequest"
      responses:
        "200":
          description: Validated violation classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViolationClassification"
        "400":
          description: Invalid image payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: The AI provider returned an unusable response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: AI classification is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/property/nyc-lookup:
    get:
      operationId: lookupNycProperty
      tags: [property]
      summary: Look up official NYC property, HPD, and DOB records by address
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: address
          required: true
          schema: { type: string, minLength: 3, maxLength: 200 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Official NYC property and violation records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NycPropertyLookup"
        "400":
          description: Invalid address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Address could not be resolved to an NYC property
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: NYC property services are unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Staff login with issued code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/procurement/login:
    post:
      operationId: procurementLogin
      tags: [auth]
      summary: Procurement-only staff login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcurementLoginInput"
      responses:
        "200":
          description: Authenticated procurement session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/platform/auth/login:
    post:
      operationId: platformOwnerLogin
      tags: [platform-owner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name: { type: string }
                code: { type: string }
      responses:
        "200":
          description: Platform owner session
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn, ownerName]
                properties:
                  accessToken: { type: string }
                  ownerName: { type: string }
                  expiresIn: { type: integer }
  /v1/platform/auth/refresh:
    post:
      operationId: refreshPlatformOwnerSession
      tags: [platform-owner]
      responses:
        "200":
          description: Rotated platform owner session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOwnerSession"
  /v1/platform/auth/logout:
    post:
      operationId: logoutPlatformOwner
      tags: [platform-owner]
      responses:
        "204": { description: Session revoked }
  /v1/platform/auth/me:
    get:
      operationId: getPlatformOwner
      tags: [platform-owner]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current platform owner
          content:
            application/json:
              schema:
                type: object
                required: [name, sessionId, typ, iat, exp]
                properties:
                  name: { type: string }
                  sessionId: { type: string }
                  typ: { type: string }
                  iat: { type: integer }
                  exp: { type: integer }
  /v1/auth/bootstrap:
    post:
      operationId: bootstrapAdministrator
      tags: [auth]
      summary: Create the first administrator for an empty tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name: { type: string }
                code: { type: string, minLength: 4, maxLength: 4 }
                tenantId: { type: string }
                firstName: { type: string }
                lastName: { type: string }
      responses:
        "201":
          description: Bootstrap session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Administrator already exists
  /v1/auth/bootstrap-status:
    get:
      operationId: getBootstrapStatus
      tags: [auth]
      summary: Check whether the default tenant already has an administrator
      responses:
        "200":
          description: Bootstrap availability
          content:
            application/json:
              schema:
                type: object
                required: [hasAdministrator]
                properties:
                  hasAdministrator: { type: boolean }
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Refreshed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke a refresh-token session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "204": { description: Session revoked }
  /v1/auth/me:
    get:
      operationId: getCurrentStaff
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current staff account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
  /v1/platform/organizations:
    get:
      operationId: listOrganizations
      tags: [platform-owner]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Organizations and license usage
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationWithUsage" }
    post:
      operationId: createOrganization
      tags: [platform-owner]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
              schema: { $ref: "#/components/schemas/OrganizationInput" }
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationCreateResponse" }
  /v1/platform/license-audit:
    get:
      operationId: listPlatformLicenseAudit
      tags: [platform-owner]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Immutable platform license audit history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformLicenseAudit" }
  /v1/platform/organizations/{id}:
    patch:
      operationId: updateOrganization
      tags: [platform-owner]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationUpdate" }
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
    delete:
      operationId: deleteOrganization
      tags: [platform-owner]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Empty organization deleted
        "400":
          description: Default organization cannot be deleted
        "404":
          description: Organization not found
        "409":
          description: Organization still has staff or registered properties
  /v1/platform/organizations/{organizationId}/properties:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listPlatformOrganizationProperties
      tags: [platform-owner]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Licensed properties owned by this organization
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OrganizationProperty" } }
    post:
      operationId: createPlatformOrganizationProperty
      tags: [platform-owner]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationPropertyInput" }
      responses:
        "201":
          description: Licensed property created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationProperty" }
  /v1/platform/organizations/{organizationId}/properties/{propertyId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string } }
      - { name: propertyId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updatePlatformOrganizationProperty
      tags: [platform-owner]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationPropertyInput" }
      responses:
        "200":
          description: Licensed property updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationProperty" }
    delete:
      operationId: deletePlatformOrganizationProperty
      tags: [platform-owner]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Licensed property deleted }
  /v1/staff:
    get:
      operationId: listStaff
      tags: [staff]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: Staff accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Staff" }
    post:
      operationId: createStaff
      tags: [staff]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInput"
      responses:
        "201":
          description: Created staff account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffIssueResponse"
  /v1/staff/developments:
    get:
      operationId: listStaffDevelopments
      tags: [staff]
      security: [{ bearerAuth: [] }]
      summary: List active developments assignable to staff by the current actor
      responses:
        "200":
          description: Sorted, deduplicated development names
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/staff/{id}/reset-code:
    post:
      operationId: resetStaffCode
      tags: [staff]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffCodeUpdate"
      responses:
        "200":
          description: New one-time access code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffIssueResponse" }
        "403":
          description: Not authorized to manage this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/staff/{id}:
    delete:
      operationId: deleteStaff
      tags: [staff]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Staff account permanently deleted
        "403":
          description: Not authorized to delete this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/staff/{id}/revoke:
    post:
      operationId: revokeStaff
      tags: [staff]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Revoked staff account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Staff" }
        "403":
          description: Not authorized to manage this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/{entity}:
    parameters:
      - { name: entity, in: path, required: true, schema: { type: string } }
    get:
      operationId: listEntityRecords
      tags: [entities]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string } }
        - { name: projectId, in: query, schema: { type: string } }
        - { name: development, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: Entity records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EntityRecord" }
    post:
      operationId: createEntityRecord
      tags: [entities]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityInput"
      responses:
        "201":
          description: Created entity record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityRecord"
  /v1/public/resident-reports:
    post:
      operationId: submitPublicResidentReport
      tags: [entities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityInput"
      responses:
        "201":
          description: Resident complaint submitted
          content:
            application/json:
               schema: { $ref: "#/components/schemas/PublicResidentReportResponse" }
  /v1/public/resident-reports/{complaintNo}:
    get:
      operationId: lookupPublicResidentReports
      tags: [entities]
      parameters:
        - { name: complaintNo, in: path, required: true, schema: { type: string } }
        - { name: address, in: query, required: true, schema: { type: string } }
        - { name: statusToken, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Matching resident complaint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicResidentReportStatus"
  /v1/public/resident-reports/{complaintNo}/photos/upload-url:
    post:
      operationId: requestPublicResidentPhotoUpload
      tags: [files]
      parameters:
        - { name: complaintNo, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicResidentPhotoUploadInput" }
      responses:
        "200":
          description: Presigned private upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileUploadUrlResponse" }
  /v1/public/resident-reports/{complaintNo}/photos/confirm:
    post:
      operationId: confirmPublicResidentPhoto
      tags: [files]
      parameters:
        - { name: complaintNo, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicResidentPhotoConfirmInput" }
      responses:
        "201":
          description: Confirmed resident photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResidentPhoto" }
  /v1/public/vendor-scopes/{trackingId}:
    get:
      operationId: lookupPublicVendorScope
      tags: [entities]
      parameters:
        - { name: trackingId, in: path, required: true, schema: { type: string } }
        - { name: vendorName, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Procurement-released vendor scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityRecord" }
        "404":
          description: Scope not found or not released
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/resident-report-photos:
    get:
      operationId: listResidentReportPhotos
      tags: [files]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: reportId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Photos attached to a resident report
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ResidentPhotoMetadata" } }
  /v1/resident-report-photos/{id}/download-url:
    post:
      operationId: requestResidentReportPhotoDownload
      tags: [files]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Scoped private photo download URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileDownloadUrlResponse" }
  /v1/public/vendor-scopes/{trackingId}/bids:
    post:
      operationId: submitPublicVendorBid
      tags: [entities]
      parameters:
        - { name: trackingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicVendorBidInput"
      responses:
        "201":
          description: Vendor bid submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityRecord" }
  /v1/{entity}/{id}:
    parameters:
      - { name: entity, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getEntityRecord
      tags: [entities]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Entity record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityRecord" }
    patch:
      operationId: updateEntityRecord
      tags: [entities]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityPatch"
      responses:
        "200":
          description: Updated entity record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityRecord" }
    delete:
      operationId: deleteEntityRecord
      tags: [entities]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        "204": { description: Record deleted }
  /v1/{entity}/{id}/actions/{action}:
    post:
      operationId: performEntityAction
      tags: [entities]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated entity record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityRecord" }
  /v1/notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Notifications for the current actor
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /v1/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
  /v1/devices/token:
    post:
      operationId: registerDeviceToken
      tags: [system]
      security: [{ bearerAuth: [] }]
      summary: Register or refresh an Expo push token for the current staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                platform: { type: string }
      responses:
        "201":
          description: Registered device token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceToken" }
        "400":
          description: Invalid Expo push token
    delete:
      operationId: unregisterDeviceToken
      tags: [system]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Device token disabled }
  /v1/push-deliveries:
    get:
      operationId: listPushDeliveries
      tags: [system]
      security: [{ bearerAuth: [] }]
      summary: List recent push delivery attempts for management
      parameters:
        - { name: notificationId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Recent delivery attempts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PushDelivery" }
        "403":
          description: Elevated management access required
  /v1/push-smoke-test:
    post:
      operationId: createPushSmokeTest
      tags: [system]
      security: [{ bearerAuth: [] }]
      summary: Send an alert to the current staging staff member
      description: Available only for the configured staging tenant when staging push smoke tests are explicitly enabled.
      responses:
        "202":
          description: Smoke-test notification queued
          content:
            application/json:
              schema:
                type: object
                required: [notificationId, message]
                properties:
                  notificationId: { type: string }
                  message: { type: string }
        "403":
          description: Elevated management access required
        "404":
          description: Staging smoke tests are disabled for this tenant
  /v1/sync:
    get:
      operationId: pullSync
      tags: [sync]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: entities, in: query, schema: { type: string } }
      responses:
        "200":
          description: Cursor-based changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
  /v1/files/upload-url:
    post:
      operationId: requestFileUploadUrl
      tags: [files]
      summary: Request a direct upload URL for a project file
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileUploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL and persistent file envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadUrlResponse"
        "400":
          description: Invalid file metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: File exceeds the 50 MB limit
        "415":
          description: Unsupported file type
        "503":
          description: File storage unavailable
  /v1/files/download-url:
    post:
      operationId: requestFileDownloadUrl
      tags: [files]
      summary: Request a temporary download URL for a stored project file
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileDownloadUrlRequest"
      responses:
        "200":
          description: Temporary presigned download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDownloadUrlResponse"
        "404":
          description: File is outside the current tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Organization:
      type: object
      required: [id, name, status, unrestricted, features, createdAt, updatedAt]
      properties:
        id: { type: string, description: System-generated organization code (ORG-XXXXXX) for new organizations; legacy organization IDs remain valid }
        name: { type: string }
        status: { type: string, enum: [active, suspended, expired] }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        staffLimit: { type: integer, nullable: true }
        propertyLimit: { type: integer, nullable: true }
        features: { type: object, additionalProperties: true }
        unrestricted: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrganizationInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
        status: { type: string, enum: [active, suspended, expired] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        staffLimit: { type: integer, nullable: true }
        propertyLimit: { type: integer, nullable: true }
        features: { type: object, additionalProperties: true }
        unrestricted: { type: boolean }
    OrganizationUpdate:
      type: object
      properties:
        name: { type: string }
        status: { type: string, enum: [active, suspended, expired] }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        staffLimit: { type: integer, nullable: true }
        propertyLimit: { type: integer, nullable: true }
        features: { type: object, additionalProperties: true }
        unrestricted: { type: boolean }
        directorName: { type: string }
        directorCode: { type: string, minLength: 4, maxLength: 4 }
    OrganizationWithUsage:
      allOf:
        - $ref: "#/components/schemas/Organization"
        - type: object
          required: [usage, developments]
          properties:
            usage:
              type: object
              required: [staff, developments]
              properties:
                staff: { type: integer }
                developments: { type: integer }
            developments:
              type: array
              items: { $ref: "#/components/schemas/OrganizationDevelopmentUsage" }
    OrganizationDevelopmentUsage:
      type: object
      required: [name, active, staff, projects, records, connectedAt]
      properties:
        name: { type: string }
        active: { type: boolean }
        staff: { type: integer }
        projects: { type: integer }
        records: { type: integer }
        connectedAt: { type: string, format: date-time }
    OrganizationCreateResponse:
      type: object
      required: [organization]
      properties:
        organization: { $ref: "#/components/schemas/Organization" }
        director:
          type: object
          required: [id, name, tenantId]
          properties:
            id: { type: string }
            name: { type: string }
            tenantId: { type: string }
    OrganizationProperty:
      type: object
      required: [id, organizationId, displayAddress, normalizedAddress, active, createdAt, updatedAt]
      properties:
        id: { type: string }
        organizationId: { type: string }
        displayAddress: { type: string }
        normalizedAddress: { type: string }
        development: { type: ["string", "null"] }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrganizationPropertyInput:
      type: object
      required: [displayAddress]
      properties:
        displayAddress: { type: string }
        development: { type: string }
        active: { type: boolean }
    PublicVendorBidInput:
      type: object
      additionalProperties: false
      required: [vendorName, amount]
      properties:
        vendorName: { type: string, minLength: 1 }
        amount: { type: number, exclusiveMinimum: 0 }
        note: { type: string }
    PublicResidentReportResponse:
      allOf:
        - $ref: "#/components/schemas/EntityRecord"
        - type: object
          required: [statusToken]
          properties:
            statusToken: { type: string }
    PublicResidentReportStatus:
      type: object
      required: [complaintNo, status, description, updates, createdAt]
      properties:
        complaintNo: { type: string }
        status: { type: string }
        description: { type: string }
        updates: { type: array, items: { type: object, additionalProperties: true } }
        createdAt: { type: string }
    PublicResidentPhotoUploadInput:
      type: object
      required: [statusToken, address, name, size, contentType]
      properties:
        statusToken: { type: string }
        address: { type: string }
        name: { type: string }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/heic, image/heif, image/webp] }
    PublicResidentPhotoConfirmInput:
      type: object
      required: [grantId, statusToken, address, objectPath]
      properties:
        grantId: { type: string, format: uuid }
        statusToken: { type: string }
        address: { type: string }
        objectPath: { type: string }
    ResidentPhoto:
      type: object
      required: [id, contentType]
      properties:
        id: { type: string }
        contentType: { type: string }
    ResidentPhotoMetadata:
      type: object
      required: [id, reportId, name, size, contentType, createdAt]
      properties:
        id: { type: string }
        reportId: { type: string }
        name: { type: string }
        size: { type: integer }
        contentType: { type: string }
        createdAt: { type: string, format: date-time }
    NycProperty:
      type: object
      required: [query, formattedAddress, houseNumber, street, borough]
      properties:
        query: { type: string }
        formattedAddress: { type: string }
        houseNumber: { type: string }
        street: { type: string }
        borough: { type: string }
        zip: { type: ["string", "null"] }
        bin: { type: ["string", "null"] }
        bbl: { type: ["string", "null"] }
        block: { type: ["string", "null"] }
        lot: { type: ["string", "null"] }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
    NycHpdViolation:
      type: object
      required: [id, source, status, description]
      properties:
        id: { type: string }
        source: { type: string, enum: [HPD] }
        class: { type: ["string", "null"] }
        status: { type: string }
        description: { type: string }
        inspectionDate: { type: ["string", "null"] }
        apartment: { type: ["string", "null"] }
        story: { type: ["string", "null"] }
        orderNumber: { type: ["string", "null"] }
    NycDobViolation:
      type: object
      required: [id, source, status, description]
      properties:
        id: { type: string }
        source: { type: string, enum: [DOB] }
        number: { type: ["string", "null"] }
        type: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
        status: { type: string }
        description: { type: string }
        issueDate: { type: ["string", "null"] }
        dispositionDate: { type: ["string", "null"] }
        dispositionComments: { type: ["string", "null"] }
        ecbNumber: { type: ["string", "null"] }
    NycHpdComplaint:
      type: object
      required: [id, source, status, description]
      properties:
        id: { type: string }
        source: { type: string, enum: [HPD] }
        status: { type: string }
        description: { type: string }
        receivedDate: { type: ["string", "null"] }
        apartment: { type: ["string", "null"] }
        majorCategory: { type: ["string", "null"] }
        minorCategory: { type: ["string", "null"] }
    NycPropertyLookupSummary:
      type: object
      required: [hpdViolations, openHpdViolations, dobViolations, openDobViolations, hpdComplaints]
      properties:
        hpdViolations: { type: integer }
        openHpdViolations: { type: integer }
        dobViolations: { type: integer }
        openDobViolations: { type: integer }
        hpdComplaints: { type: integer }
    NycPropertyLookup:
      type: object
      required: [property, summary, hpdViolations, dobViolations, hpdComplaints, warnings, retrievedAt]
      properties:
        property: { $ref: "#/components/schemas/NycProperty" }
        summary: { $ref: "#/components/schemas/NycPropertyLookupSummary" }
        hpdViolations:
          type: array
          items: { $ref: "#/components/schemas/NycHpdViolation" }
        dobViolations:
          type: array
          items: { $ref: "#/components/schemas/NycDobViolation" }
        hpdComplaints:
          type: array
          items: { $ref: "#/components/schemas/NycHpdComplaint" }
        warnings:
          type: array
          items: { type: string }
        retrievedAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ViolationClassificationRequest:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          type: string
          minLength: 32
          maxLength: 11184849
          pattern: "^data:image/(jpeg|png|webp);base64,[A-Za-z0-9+/]+={0,2}$"
    ViolationClassification:
      type: object
      additionalProperties: false
      required:
        [classification, confidence, condition, hpCode, trade, priority, description]
      properties:
        classification:
          type: string
          enum: [A, B, C]
        confidence:
          type: integer
          minimum: 0
          maximum: 100
        condition:
          type: string
          minLength: 1
          maxLength: 300
        hpCode:
          type: string
          minLength: 1
          maxLength: 100
        trade:
          type: string
          minLength: 1
          maxLength: 100
        priority:
          type: string
          enum: [Low, Medium, High]
        description:
          type: string
          minLength: 1
          maxLength: 1000
    LoginInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string }
        code: { type: string, minLength: 4, maxLength: 4 }
        role: { type: string }
        organizationId: { type: string, description: Required for non-default customer organizations }
    ProcurementLoginInput:
      type: object
      required: [name, code, organizationId]
      properties:
        name: { type: string }
        code: { type: string, minLength: 4, maxLength: 4 }
        organizationId: { type: string, minLength: 1 }
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, staff]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer }
        staff: { $ref: "#/components/schemas/Staff" }
    RefreshTokenInput:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1 }
    PlatformOwnerSession:
      type: object
      required: [accessToken, expiresIn, ownerName]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer }
        ownerName: { type: string }
    PlatformLicenseAudit:
      type: object
      required: [id, ownerName, action, organizationId, at]
      properties:
        id: { type: string }
        ownerName: { type: string }
        action: { type: string }
        organizationId: { type: string }
        before: { type: object, nullable: true, additionalProperties: true }
        after: { type: object, nullable: true, additionalProperties: true }
        at: { type: string, format: date-time }
    Staff:
      type: object
      required: [id, tenantId, name, role, position, status, developments]
      properties:
        id: { type: string }
        tenantId: { type: string }
        name: { type: string }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        role:
          type: string
          enum: [administrator, management, worker, inspector, procurement, vendor, resident, emergency]
        position:
          type: string
          enum: [Borough Director, Regional Director, Property Manager, Assistant Property Manager, Superintendent, Assistant Superintendent, Housing Assistant, Maintenance Worker, Caretaker, Groundskeeper, Janitorial Staff, CPM, Inspector, Elevator Service, Plumber, Electrician, Plumber Supervisor, Electric Supervisor, Elevator Supervisor, Carpenter, Roofer, General Construction, CCTV Installation, Heating Service, Staff Worker, Director, Other]
        status: { type: string }
        developments:
          type: array
          items: { type: string }
        canManage: { type: boolean }
        canResetCode: { type: boolean }
        canRevoke: { type: boolean }
        canDelete: { type: boolean }
    StaffIssueResponse:
      allOf:
        - $ref: "#/components/schemas/Staff"
        - type: object
          required: [code]
          properties:
            code: { type: string, minLength: 4, maxLength: 4 }
    StaffInput:
      type: object
      required: [name, role, position]
      properties:
        name: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        role:
          type: string
          enum: [administrator, management, worker, inspector, procurement, vendor, emergency]
        position:
          type: string
          enum: [Borough Director, Regional Director, Property Manager, Assistant Property Manager, Superintendent, Assistant Superintendent, Housing Assistant, Maintenance Worker, Caretaker, Groundskeeper, Janitorial Staff, CPM, Inspector, Elevator Service, Plumber, Electrician, Plumber Supervisor, Electric Supervisor, Elevator Supervisor, Carpenter, Roofer, General Construction, CCTV Installation, Heating Service, Staff Worker, Director, Other]
        developments:
          type: array
          items: { type: string }
        code: { type: string, minLength: 4, maxLength: 4 }
    StaffCodeUpdate:
      type: object
      properties:
        code:
          type: string
          minLength: 4
          maxLength: 4
          pattern: "^[A-Z0-9]{4}$"
    EntityInput:
      type: object
      required: [id, state]
      properties:
        id: { type: string }
        projectId: { type: string }
        development: { type: string }
        state: { type: object, additionalProperties: true }
        version: { type: integer, minimum: 1 }
    EntityRecord:
      allOf:
        - $ref: "#/components/schemas/EntityInput"
        - type: object
          required: [entity, createdAt, updatedAt, version]
          properties:
            entity: { type: string }
            deleted: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            version: { type: integer }
    EntityPatch:
      allOf:
        - $ref: "#/components/schemas/EntityInput"
        - type: object
          required: [version]
    Notification:
      type: object
      required: [id, target, message, read, at]
      properties:
        id: { type: string }
        target: { type: string }
        message: { type: string }
        detail: { type: string, nullable: true }
        reportId: { type: string, nullable: true }
        read: { type: boolean }
        at: { type: string, format: date-time }
    DeviceToken:
      type: object
      required: [id, tenantId, staffId, token, lastSeenAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        staffId: { type: string }
        token: { type: string }
        platform: { type: string, nullable: true }
        lastSeenAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PushDelivery:
      type: object
      required:
        [id, tenantId, notificationId, status, attemptedAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        notificationId: { type: string }
        tokenId: { type: string, nullable: true }
        staffId: { type: string, nullable: true }
        status: { type: string }
        ticketId: { type: string, nullable: true }
        errorCode: { type: string, nullable: true }
        detail: { type: string, nullable: true }
        receiptAttempts: { type: integer }
        nextReceiptCheckAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        attemptedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SyncResponse:
      type: object
      required: [cursor, records, notifications]
      properties:
        cursor: { type: string, format: date-time }
        records:
          type: array
          items: { $ref: "#/components/schemas/EntityRecord" }
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
    FileKind:
      type: string
      enum:
        - room-photo
        - inspection-evidence
        - completion-photo
        - scan
        - procurement-scope
        - resident-report-photo
    StoredFile:
      type: object
      required: [id, kind, name, size, contentType, objectPath, createdAt, createdBy]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/FileKind" }
        name: { type: string }
        size: { type: integer, minimum: 1, maximum: 52428800 }
        contentType: { type: string }
        objectPath: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
    FileUploadUrlRequest:
      type: object
      required: [kind, name, size, contentType]
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/FileKind" }
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 52428800 }
        contentType: { type: string, minLength: 1, maxLength: 100 }
    FileUploadUrlResponse:
      type: object
      required: [uploadUrl, file]
      properties:
        uploadUrl: { type: string, format: uri }
        file: { $ref: "#/components/schemas/StoredFile" }
    FileDownloadUrlRequest:
      type: object
      required: [objectPath]
      additionalProperties: false
      properties:
        objectPath:
          type: string
          pattern: "^/objects/tenants/"
    FileDownloadUrlResponse:
      type: object
      required: [downloadUrl, expiresIn]
      properties:
        downloadUrl: { type: string, format: uri }
        expiresIn: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
