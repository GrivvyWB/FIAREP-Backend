openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
  - name: staff
  - name: entities
  - name: notifications
  - name: sync
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Staff login with issued code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Refreshed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/me:
    get:
      operationId: getCurrentStaff
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current staff account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
  /v1/staff:
    get:
      operationId: listStaff
      tags: [staff]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: Staff accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Staff" }
    post:
      operationId: createStaff
      tags: [staff]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInput"
      responses:
        "201":
          description: Created staff account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
  /v1/{entity}:
    parameters:
      - { name: entity, in: path, required: true, schema: { type: string } }
    get:
      operationId: listEntityRecords
      tags: [entities]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string } }
        - { name: projectId, in: query, schema: { type: string } }
        - { name: development, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: Entity records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EntityRecord" }
    post:
      operationId: createEntityRecord
      tags: [entities]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityInput"
      responses:
        "201":
          description: Created entity record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityRecord"
  /v1/{entity}/{id}:
    parameters:
      - { name: entity, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getEntityRecord
      tags: [entities]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Entity record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityRecord" }
    patch:
      operationId: updateEntityRecord
      tags: [entities]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityInput"
      responses:
        "200":
          description: Updated entity record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityRecord" }
    delete:
      operationId: deleteEntityRecord
      tags: [entities]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Record deleted }
  /v1/notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Notifications for the current actor
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /v1/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
  /v1/sync:
    get:
      operationId: pullSync
      tags: [sync]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: entities, in: query, schema: { type: string } }
      responses:
        "200":
          description: Cursor-based changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LoginInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string }
        code: { type: string, minLength: 4, maxLength: 4 }
        role: { type: string }
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, staff]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer }
        staff: { $ref: "#/components/schemas/Staff" }
    Staff:
      type: object
      required: [id, name, role, position, status, developments]
      properties:
        id: { type: string }
        name: { type: string }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        role: { type: string }
        position: { type: string }
        status: { type: string }
        developments:
          type: array
          items: { type: string }
    StaffInput:
      type: object
      required: [name, role, position]
      properties:
        name: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        role: { type: string }
        position: { type: string }
        developments:
          type: array
          items: { type: string }
        code: { type: string, minLength: 4, maxLength: 4 }
    EntityInput:
      type: object
      required: [id, state]
      properties:
        id: { type: string }
        projectId: { type: string }
        development: { type: string }
        state: { type: object, additionalProperties: true }
    EntityRecord:
      allOf:
        - $ref: "#/components/schemas/EntityInput"
        - type: object
          required: [entity, createdAt, updatedAt, version]
          properties:
            entity: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            version: { type: integer }
    Notification:
      type: object
      required: [id, target, message, read, at]
      properties:
        id: { type: string }
        target: { type: string }
        message: { type: string }
        detail: { type: string, nullable: true }
        reportId: { type: string, nullable: true }
        read: { type: boolean }
        at: { type: string, format: date-time }
    SyncResponse:
      type: object
      required: [cursor, records, notifications]
      properties:
        cursor: { type: string, format: date-time }
        records:
          type: array
          items: { $ref: "#/components/schemas/EntityRecord" }
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

